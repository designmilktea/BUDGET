<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101113"><title>Daily Budget</title><link rel="stylesheet" href="./src/style.css"></head><body>
<div class="app"><header class="top"><div class="topline"><span>PROJECTED REMAINING TODAY</span><div class="headeractions"><button class="gear" id="destinationbtn" aria-label="Entry destination: Add to cart. Switch to Spent Today" title="Add to cart · Switch to Spent Today"></button><button class="gear" id="settingsbtn" aria-label="Settings">⚙</button></div></div><div id="projected" class="big"></div><div class="warning" id="warning" hidden></div></header>
<div id="cloudnotice" class="storagewarning" role="status" hidden></div><div id="storagewarning" class="storagewarning" role="alert" hidden></div><main class="middle" id="middle"><div class="listhead"><strong id="listtitle"></strong><span id="listtotal"></span></div><div id="cart" class="cart"></div><div id="purchases" class="purchases" hidden></div><button class="checkout" id="checkout"></button><div class="feedback" id="feedback" role="status"></div></main>
<section class="calculator" aria-label="Calculator"><div class="screen"><div class="expression" id="expression"></div><div class="number" id="number" aria-live="polite">0</div></div><div class="keypad" id="quickpad"></div><div class="keypad" id="fullpad" hidden></div><button id="fullsave" class="fullsave" hidden></button></section></div>
<dialog id="settingsdialog" aria-labelledby="settingstitle"><div class="settingshead"><h2 id="settingstitle">Settings</h2><button class="close" id="closesettings" aria-label="Close settings">×</button></div><div class="fieldlabel">Account</div><div id="accountname" class="accountname">Not signed in</div><button id="googlelogin" class="accountbutton">Sign in with Google</button><button id="googlelogout" class="accountbutton" hidden>Sign out</button><div id="cloudstatus" class="cloudstatus" role="status">Saved on this browser</div><button id="cloudretry" class="accountbutton" hidden>Retry cloud sync</button><div class="fieldlabel">Calculator type</div><div class="selector" id="types"><button data-type="quick">Quick entry</button><button data-type="full">Full calculator</button></div><label class="fieldlabel" for="budgetinput" style="display:block">Daily budget (JPY)</label><div class="budgetedit"><input id="budgetinput" type="number" min="0" step="1" inputmode="numeric"><button id="savebudget">Save</button></div><div id="budgeterror" class="budgeterror" role="alert"></div><button id="previousdays" class="previousbutton">Previous days <span aria-hidden="true" style="float:right">›</span></button></dialog>
<dialog id="deletedialog" aria-labelledby="deletetitle" aria-describedby="deletedescription"><h2 id="deletetitle">Delete purchase?</h2><p id="deletedescription"></p><div class="modalbuttons"><button id="canceldelete" autofocus>Cancel</button><button class="danger" id="confirmdelete">Delete purchase</button></div></dialog>
<dialog id="historydialog" aria-labelledby="historytitle"><div class="settingshead"><h2 id="historytitle">Previous days</h2><span class="history-readonly">Read only</span><button class="close" id="closehistory" aria-label="Close previous days">×</button></div><div class="fieldlabel">Budget</div><div class="history-scope">Personal budget · Private</div><div class="history-access"><span aria-hidden="true">🔒</span> Only you</div><label for="historydate" class="fieldlabel" id="historydatelabel">Date</label><select id="historydate" class="historydate"></select><div id="historycontent"></div><div class="modalbuttons history-footer"><button id="backtoday">Back to today</button></div></dialog>
<script src="./src/app.js"></script><script type="module" src="./src/account.js" onerror="document.getElementById('cloudstatus').textContent='Google sign-in is unavailable. Data remains saved on this browser.'"></script></body></html>
