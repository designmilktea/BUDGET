<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f2"><meta name="description" content="See what remains today. Consider purchases, choose what to buy, and keep your daily spending up to date.">
  <title>Daily budget</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%232d5b47'/%3E%3Cpath d='M18 33l9 9 20-22' fill='none' stroke='white' stroke-width='6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <main class="wallet">
    <header class="balance-panel">
      <div class="eyebrow-row"><h1>Projected remaining today</h1><button id="budget-button" class="quiet" disabled>Budget <span id="budget-value">—</span><span aria-hidden="true"> ↗</span></button></div>
      <div id="projected" class="balance" aria-live="polite">—</div>
      <div class="balance-detail"><span>Actual balance <strong id="actual">—</strong></span><span class="divider" aria-hidden="true"></span><span>Selected <strong id="selected-total">—</strong></span></div>
    </header>
    <section id="sign-in-panel" class="sign-in-panel" hidden>
      <p>Keep your budget with you.</p><button id="sign-in" class="google-button"><span class="google-g" aria-hidden="true">G</span>Continue with Google</button>
    </section>
    <div id="status" class="status" role="status">Connecting…</div>
    <section class="cart-section" aria-labelledby="cart-heading">
      <div class="section-heading"><h2 id="cart-heading">Considering <span id="cart-count" class="count">0</span></h2><span id="selection-count" class="muted">0 selected</span></div>
      <div id="cart" class="items"></div>
      <div class="entry-box">
        <div class="tabs" role="tablist" aria-label="Entry type"><button id="cart-tab" role="tab" aria-selected="true" aria-controls="entry-form">Add to cart</button><button id="purchase-tab" role="tab" aria-selected="false" aria-controls="entry-form">Record purchase</button></div>
        <form id="entry-form" aria-labelledby="cart-tab">
          <label class="sr-only" for="item-name">Item name (optional)</label><input id="item-name" name="name" placeholder="Item name (optional)" maxlength="100" autocomplete="off" disabled>
          <div class="amount-entry"><span aria-hidden="true">$</span><label class="sr-only" for="item-amount">Amount ($)</label><input id="item-amount" name="amount" inputmode="decimal" placeholder="0.00" autocomplete="off" required disabled><button id="add-button" type="submit" aria-label="Add to cart" disabled><span aria-hidden="true">+</span></button></div>
        </form>
      </div>
      <button id="checkout" class="checkout" disabled><span>Checkout selected</span><span id="checkout-total">$0.00 <span aria-hidden="true">↗</span></span></button>
    </section>
    <section class="spent-section" aria-label="Spent today"><details id="spent-details"><summary><span class="spent-label">Spent today <span id="purchase-count" class="count">0</span></span><span class="spent-right"><strong id="spent-total">—</strong><span class="chevron" aria-hidden="true">⌄</span></span></summary><div id="purchases" class="items"></div></details></section>
    <footer id="account" hidden><span id="account-name"></span><button id="sign-out" class="quiet">Sign out</button></footer>
    <div id="toast" class="toast" role="status" hidden><span id="toast-text"></span><button id="undo">Undo</button><button id="dismiss-toast" aria-label="Dismiss notification">×</button></div>
  </main>
  <dialog id="budget-dialog"><form id="budget-form"><div class="dialog-heading"><h2>Daily budget</h2><button id="close-budget" type="button" class="icon-button" aria-label="Close">×</button></div><label for="budget-input">Amount ($)</label><input id="budget-input" inputmode="decimal" required autocomplete="off"><p class="muted">Applies today and becomes your daily budget going forward.</p><button class="checkout" type="submit">Save budget</button></form></dialog>
  <noscript>Please enable JavaScript to use your budget.</noscript>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
